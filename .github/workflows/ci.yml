name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y libsndfile1
      - run: pip install -r requirements.txt
      - run: pytest -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # ParityTest checks the Kotlin feature extractor against tests/fixtures/parity_features.txt from the Python side
      - run: gradle -p android --no-daemon :rainsense:testDebugUnitTest :app:assembleDebug
